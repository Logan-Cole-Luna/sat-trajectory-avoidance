# Enhanced Training Configuration for Improved RL Performance v2

# python train_sat.py 

vec_env: dummy   # dummy for deterministic training
num_envs: 8      # Increased parallel environments
device: cpu

train:
  # Training duration - focused session
  total_timesteps: 1000000  # 1M timesteps for faster iteration
  eval_freq: 20000         # Frequent evaluation to monitor improvement
  checkpoint_freq: 100000
  disable_eval: false
  
  # Resume training configuration
  resume:
    enabled: False 
    model_path: "models/train/ppo_checkpoint_400000_steps.zip"  # Latest checkpoint
    start_timestep: 400000  # Timesteps already completed
  
  # Collision system configuration
  collision:
    guarantee: false  # Mix of collision and non-collision scenarios
    probability: 1.0  # Slightly lower for better balance
    ttc_steps: 20
  debris_radius_m: 50.0  # Moderate challenge
  
  # Physical parameters
  max_thrust: 0.15    # Increased from 0.05 for feasible avoidance maneuvers
  
  # Reward shaping parameters for improved collision avoidance
  reward:
    collision_penalty: 1000.0      # Large penalty for collision
    survival_reward: 0.02          # Base survival tick
    distance_shaping_coeff: 0.0002 # Distance safety shaping coefficient
    coast_bonus: 0.05              # Bonus for coasting when far
    delta_v_linear_cost: 8.0       # Linear delta-v cost
    delta_v_quadratic_cost: 0.8    # Quadratic delta-v cost
    large_burn_penalty: 4.0        # Penalty for burns > 0.2 m/s
    smoothness_penalty: 0.008      # Action smoothness penalty
    cumulative_dv_penalty: 0.3     # Soft cap penalty multiplier
    projected_miss_reward: 0.0002  # Projected miss improvement reward
    milestone_reward: 0.4          # Periodic survival milestone reward
  
  # PPO Hyperparameters - Balanced for collision avoidance
  n_steps: 2048        # Steps per environment per update
  batch_size: 256      # Smaller batches for better gradients
  n_epochs: 10         # More epochs per update
  
  # Learning rate and regularization
  learning_rate: 0.0003  # Higher learning rate for faster learning
  lr_schedule: "constant"  # Keep constant for stability
  ent_coef: 0.01        # Higher entropy for more exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  
  # Advanced parameters for better convergence
  gamma: 0.995         # Slightly lower discount for shorter-term focus
  gae_lambda: 0.95     # GAE parameter
  clip_range: 0.2
  target_kl: 0.01      # Target KL divergence
  net_arch: [256, 256, 128]  # Larger network architecture

# Curriculum Learning Configuration - More balanced progression
curriculum:
  enabled: true
  stages:
    - name: "easy_start"
      timesteps: 250000
      collision_probability: 1.0
      debris_radius_m: 25.0
    - name: "moderate"
      timesteps: 350000
      collision_probability: 1.0
      debris_radius_m: 50.0
    - name: "challenging"
      timesteps: 400000
      collision_probability: 1.0
      debris_radius_m: 100.0

# Testing after training - Use representative difficulty
test:
  steps: 1000
  collision_probability: 1      
  debris_radius_m: 10.0           
  collision_distance_m: 300.0   
  ttc_steps: 250                  
  max_thrust: 5                 
  guarantee_collision: false      
